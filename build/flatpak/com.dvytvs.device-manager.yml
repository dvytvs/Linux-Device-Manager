id: com.dvytvs.device-manager
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: linux-device-manager
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=/sys/class:ro
  - --filesystem=/proc:ro
  - --filesystem=/dev:ro
modules:
  - name: linux-device-manager
    buildsystem: simple
    build-commands:
      - install -Dm755 device_manager.py /app/bin/linux-device-manager
      - install -Dm644 linux-device-manager.desktop /app/share/applications/linux-device-manager.desktop
      - install -Dm644 build/icons/linux/icon.png /app/share/icons/hicolor/512x512/apps/linux-device-manager.png
    sources:
      - type: dir
        path: ../..
